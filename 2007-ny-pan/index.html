<style>
/* NY Pan: panoramic thumbnails, edge-to-edge like the other projects */
.project-grid {
  height:auto;
  min-height:0;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:none;
  grid-auto-rows:auto;
  gap:0 !important;
  background:var(--ink);
}
.tile {
  aspect-ratio:1920 / 664;
}
.tile img {
  object-fit:cover;
}
@media (min-width:651px) and (max-width:1024px) {
  .project-grid {
    height:auto;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:none;
    grid-auto-rows:auto;
    gap:0 !important;
  }
}
@media(max-width:650px) {
  .project-grid {
    height:auto;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:none;
    grid-auto-rows:auto;
    gap:0 !important;
  }
}
</style>
<style>
/* NY Pan: use the same dynamic gallery system as the other projects, with no gutters. */
.project-grid.dynamic-grid {
  height:auto;
  min-height:0;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:none;
  grid-auto-rows:auto;
  gap:0 !important;
}
.project-grid.dynamic-grid .tile {
  aspect-ratio:1920 / 664;
}
@media (min-width:651px) and (max-width:1024px) {
  .project-grid.dynamic-grid {
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:none;
    grid-auto-rows:auto;
    gap:0 !important;
  }
}
@media(max-width:650px) {
  .project-grid.dynamic-grid {
    grid-template-columns:repeat(2,1fr) !important;
    grid-template-rows:none !important;
    grid-auto-rows:auto;
    gap:0 !important;
  }
}
</style>
