<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CV — David Besora">
<title>CV — David Besora</title>
<link rel="stylesheet" href="cv.css">

<style>
:root{--paper:#e9e6de;--ink:#11110f;--rust:#9e341c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue","Neue Haas Grotesk",Helvetica,Arial,sans-serif;font-weight:300}
body{min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.cv-header{height:180px;padding:25px 28px;display:grid;grid-template-columns:1fr auto;align-items:start}
.cv-header a{display:block;width:min(650px,70vw)}
.cv-header img{display:block;width:100%;height:auto}
.cv-main{flex:1;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cv-main h1{margin:0;font-size:clamp(42px,3.4vw,58px);font-weight:300;line-height:.88;letter-spacing:-.075em;white-space:nowrap}
.cv-languages{display:flex;justify-content:center;gap:42px;margin:28px 0 0;font-size:16px;line-height:1;text-transform:uppercase;letter-spacing:.06em;color:#5e5c56}
.cv-languages a:hover{color:var(--rust)}
footer{height:54px;min-height:54px;padding:18px 28px;display:flex;align-items:center;gap:24px;background:var(--ink);color:var(--paper);font-size:12px;line-height:1}
footer span{margin-left:auto;color:#97958e}
@media (min-width:651px) and (max-width:1024px){.cv-header{height:150px;padding:20px}.cv-header a{width:min(650px,70vw)}.cv-main{padding:20px}.cv-main h1{font-size:5vw}.cv-languages{margin-top:26px;gap:32px}footer{height:50px;min-height:50px;padding:16px 20px}}
@media(max-width:650px){.cv-header{height:120px;padding:16px}.cv-header a{width:min(430px,78vw)}.cv-main{padding:16px;min-height:calc(100svh - 174px)}.cv-main h1{font-size:13vw;line-height:.9}.cv-languages{margin-top:24px;gap:22px;font-size:15px}footer{height:auto;min-height:118px;padding:20px 16px;flex-direction:column;align-items:flex-start;gap:8px}footer span{margin:12px 0 0}}
</style>
</head>
<body>
<header class="cv-header">
  <a href="archive.html" aria-label="David Besora, índice"><img src="logo.png" alt="David Besora"></a>
</header>
<main class="cv-main">
  <h1>CV</h1>
  <nav class="cv-languages" aria-label="Idioma del CV">

    <a href="CV-ES.pdf" target="_blank" rel="noopener">ES</a>
    <a href="CV-ENG.pdf" target="_blank" rel="noopener">ENG</a>
  </nav>
</main>
<footer id="contact">
  <a href="tel:+34609701495">+34 609 701 495</a>
  <a href="mailto:davidbesora@gmail.com">davidbesora@gmail.com</a>
  <a href="cv.html">CV</a>
  <a href="https://www.instagram.com/david.besora/" rel="noopener" target="_blank">Instagram</a>
  <span>© David Besora</span>
</footer>
</body>
</html>
