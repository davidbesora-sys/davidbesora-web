<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caixa Negra — David Besora</title>
<link rel="stylesheet" href="../2007-ny-86th-floor/style.css">
<link rel="stylesheet" href="../2007-ny-86th-floor/compact.css">
<link rel="stylesheet" href="../site-fixes.css">
</head>
<body>
<header class="masthead">
  <div class="name">DAVID BESORA</div>
  <div class="edition">PORTFOLIO</div>
  <nav><a href="../index.html">INDEX</a><a href="../contact.html">CONTACT</a></nav>
</header>
<section class="intro">
  <div>
    <h1>Caixa Negra</h1>
    <div class="project-meta"><span>2016</span><span>05</span></div>
  </div>
</section>
<section class="project-grid compact-grid">
  <button class="tile" type="button" data-index="0"><img src="images/IMG_5552_retocada.jpg" alt="Caixa Negra 1"></button>
  <button class="tile" type="button" data-index="1"><img src="images/IMG_5644_retocada.jpg" alt="Caixa Negra 2"></button>
  <button class="tile" type="button" data-index="2"><img src="images/IMG_5649_retocada.jpg" alt="Caixa Negra 3"></button>
  <button class="tile" type="button" data-index="3"><img src="images/IMG_5667_retocada.jpg" alt="Caixa Negra 4"></button>
  <button class="tile" type="button" data-index="4"><img src="images/IMG_5705_retocada.jpg" alt="Caixa Negra 5"></button>
</section>
<div class="viewer" aria-hidden="true">
  <button class="viewer-close" type="button" aria-label="Cerrar">×</button>
  <button class="viewer-prev" type="button" aria-label="Anterior">‹</button>
  <img class="viewer-image" src="" alt="">
  <button class="viewer-next" type="button" aria-label="Siguiente">›</button>
</div>
<script>
(() => {
  const tiles = [...document.querySelectorAll('.tile')];
  const viewer = document.querySelector('.viewer');
  const viewerImage = document.querySelector('.viewer-image');
  const close = document.querySelector('.viewer-close');
  const prev = document.querySelector('.viewer-prev');
  const next = document.querySelector('.viewer-next');
  let current = 0;
  const show = (index) => {
    current = (index + tiles.length) % tiles.length;
    const img = tiles[current].querySelector('img');
    viewerImage.src = img.src;
    viewerImage.alt = img.alt;
    viewer.setAttribute('aria-hidden', 'false');
    viewer.classList.add('is-open');
  };
  const hide = () => {
    viewer.classList.remove('is-open');
    viewer.setAttribute('aria-hidden', 'true');
  };
  tiles.forEach((tile, index) => tile.addEventListener('click', () => show(index)));
  close.addEventListener('click', hide);
  prev.addEventListener('click', () => show(current - 1));
  next.addEventListener('click', () => show(current + 1));
  document.addEventListener('keydown', (event) => {
    if (!viewer.classList.contains('is-open')) return;
    if (event.key === 'Escape') hide();
    if (event.key === 'ArrowLeft') show(current - 1);
    if (event.key === 'ArrowRight') show(current + 1);
  });
})();
</script>
</body>
</html>
